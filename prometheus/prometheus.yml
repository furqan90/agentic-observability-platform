#  Observability Platform — Prometheus scrape config
#
# Prometheus scrapes the OTel Collector for agent RED metrics AND infra
# exporters for the host/DB side. The combination is what enables agent↔infra
# correlation in Grafana — agent metrics alone would just duplicate LangFuse.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Agent RED metrics (rate/errors/duration) from the spanmetrics connector
  - job_name: "otel-collector"
    static_configs:
      - targets: ["otel-collector:8889"]

  # ── Infra side: this is what LangFuse cannot see ──
  #
  # node-exporter and cadvisor are behind the "linux" compose profile.
  # On Windows (Docker Desktop) these targets show as "down" — harmless.
  # On Linux / AKS: docker compose ... --profile linux up -d
  - job_name: "node"            # host CPU/mem/disk/net (node_exporter)
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: "cadvisor"        # per-container resource usage (Linux / AKS)
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: "cadvisor-windows"  # Docker-socket-only variant for Docker Desktop on Windows
    static_configs:
      - targets: ["cadvisor-windows:8080"]

  - job_name: "postgres"        # connection pool, query latency (postgres_exporter)
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
