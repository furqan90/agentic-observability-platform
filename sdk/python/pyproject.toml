[project]
name = "agentic-observability-sdk"
version = "0.2.0"
description = "agent instrumentation facade (LangFuse v4 + OpenTelemetry). Agents import this, never langfuse directly."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Furqan", email = "furqan@example.com" }]
dependencies = [
    "langfuse>=4.0.0,<5.0.0",
    "opentelemetry-sdk>=1.25.0",
    "opentelemetry-exporter-otlp>=1.25.0",
]

[project.optional-dependencies]
# Framework integrations — install whichever your agent uses:
#   pip install "agentic-observability-sdk[openai]"
#   pip install "agentic-observability-sdk[anthropic]"
#   pip install "agentic-observability-sdk[langchain]"
#   pip install "agentic-observability-sdk[all]"       # everything
openai    = ["openai>=1.0.0"]
anthropic = ["anthropic>=0.20.0", "openinference-instrumentation-anthropic>=0.1.0"]
langchain = ["langchain>=0.1.0"]
all       = ["openai>=1.0.0", "anthropic>=0.20.0", "openinference-instrumentation-anthropic>=0.1.0", "langchain>=0.1.0"]
dev       = ["pytest>=8.0", "ruff>=0.5"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# pip install name : agentic-observability-sdk
# import name      : agentic_observability_sdk
# These are intentionally the same (dash vs underscore) so developers never
# have to remember two different names.
#
# Install editable:  pip install -e ./agentic_observability_sdk
# Install from Git:  pip install "agentic-observability-sdk @ git+https://github.com/furqan90/agentic_observability_platform.git#subdirectory=sdk/python"
[tool.setuptools.packages.find]
where = ["."]
include = ["agentic_observability_sdk*"]

[tool.ruff]
line-length = 100
target-version = "py310"
