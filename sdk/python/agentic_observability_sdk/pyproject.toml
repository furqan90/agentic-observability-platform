[project]
name = "agentic-observability-sdk"
version = "0.1.0"
description = " agent instrumentation facade (LangFuse v3 + OpenTelemetry). Agents import this, never langfuse directly."
readme = "README.md"
requires-python = ">=3.10,<3.14"  # langfuse 3.x uses pydantic.v1 shim incompatible with Python 3.14+
authors = [{ name = "Furqan", email = "furqan@example.com" }]
dependencies = [
    "langfuse>=3.0.0,<4.0.0",
    "opentelemetry-sdk>=1.25.0",
    "opentelemetry-exporter-otlp>=1.25.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# pip install name : agentic-observability-sdk
# import name      : agentic_observability_sdk
# These are intentionally the same (dash vs underscore) so developers never
# have to remember two different names.
#
# Install editable:  pip install -e ./agentic_observability_sdk
# Install from Git:  pip install "agentic-observability-sdk @ git+https://github.com/furqan90/agentic_observability_platform.git#subdirectory=agentic_observability_sdk"
[tool.setuptools.packages.find]
where = ["."]
include = ["agentic_observability_sdk*"]

[tool.ruff]
line-length = 100
target-version = "py310"
