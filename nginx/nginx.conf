# Observability Platform — local reverse proxy / TLS terminator.
#
# Stage 1 (local): optional. The compose stack already publishes ports directly.
# This file models the production entry point so the local shape matches AKS:
#   • TLS termination
#   • per-client bearer-token auth on the OTLP intake (phone-home boundary)
#   • upstreams to LangFuse + the OTel Collector
#
# To use locally: generate a self-signed cert into nginx/certs/ and add an
# nginx service to docker-compose.override.yml mounting this file.

events { worker_connections 1024; }

http {
  # ── Per-client tokens. One credential per client engagement so traffic can
  #    be revoked/attributed independently. Map the bearer token to an allow flag.
  map $http_authorization $client_authorized {
    default                                 0;
    "Bearer local-dev-token"      1;
    # "Bearer <client-acme-token>"          1;
  }

  upstream langfuse_web   { server langfuse-web:3000; }
  upstream otel_collector { server otel-collector:4318; }

  # ── HTTPS: LangFuse UI/API ───────────────────────────────────────
  server {
    listen 443 ssl;
    server_name langfuse.localhost;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location / {
      proxy_pass http://langfuse_web;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }

  # ── HTTPS: OTLP intake (phone-home), token-gated ─────────────────
  server {
    listen 4318 ssl;
    server_name otlp.localhost;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # In production, prefer mTLS (ssl_verify_client on) over a shared bearer token.
    location / {
      if ($client_authorized = 0) { return 401; }
      proxy_pass http://otel_collector;
      proxy_set_header Host            $host;
      proxy_set_header X-Real-IP       $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
  }

  # Plain HTTP → redirect to HTTPS.
  server {
    listen 80 default_server;
    server_name _;
    return 301 https://$host$request_uri;
  }
}
