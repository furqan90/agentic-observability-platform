# Observability Platform — OpenTelemetry Collector config
#
# The fan-out heart of the platform:
#   • spans  → LangFuse v3 via its native OTLP endpoint (tracing / eval / cost)
#   • spans  → span_metrics connector → RED metrics → Prometheus (ops)
#   • push metrics (token/cost counters from SDK) → otlp receiver → Prometheus
#
# Metric naming (Collector v0.153.0+):
#   calls_total  →  traces_span_metrics_calls_total
#   duration_milliseconds  →  traces_span_metrics_duration_milliseconds

receivers:
  otlp:
    protocols:
      grpc: { endpoint: 0.0.0.0:4317 }
      http: { endpoint: 0.0.0.0:4318 }

connectors:
  # "spanmetrics" alias is deprecated in v0.153.0+; use "span_metrics"
  span_metrics:
    histogram:
      explicit:
        # 3s bucket boundary is required by the 95%-under-3000ms latency SLO
        # in prometheus/rules/slo-alerts.yml (duration_milliseconds_bucket{le="3000"}).
        # Prometheus histograms only have data at exact configured "le" boundaries,
        # so without this the latency SLI/burn-rate queries return no data, period.
        buckets: [50ms, 100ms, 250ms, 500ms, 1s, 2s, 3s, 5s, 10s, 30s]
    dimensions:
      - name: agent.name
      - name: gen_ai.request.model
    metrics_flush_interval: 15s

processors:
  batch: {}
  resource:
    attributes:
      - { key: deployment.platform, value: platform, action: upsert }
  # Central PII / client-data redaction BEFORE traces reach any backend.
  # Tune the keys to match what your agents attach. (See plan §Security.)
  attributes/redaction:
    actions:
      - { key: user.email, action: delete }
      - { key: user.ip, action: delete }
      - { key: client.ssn, action: delete }

exporters:
  # Traces → LangFuse via its native OTLP endpoint.
  # "otlphttp" alias deprecated in v0.153.0+; use "otlp_http"
  otlp_http/langfuse:
    endpoint: http://langfuse-web:3000/api/public/otel
    headers:
      # base64("public_key:secret_key") — injected from the LANGFUSE_OTEL_AUTH env var.
      Authorization: "Basic ${env:LANGFUSE_OTEL_AUTH}"

  # Metrics → Prometheus scrape endpoint on :8889
  prometheus:
    endpoint: 0.0.0.0:8889
    enable_open_metrics: true

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [attributes/redaction, resource, batch]
      exporters: [otlp_http/langfuse, span_metrics]
    metrics:
      # otlp: accepts push metrics from SDK (token/cost counters via OTLP /v1/metrics)
      # span_metrics: receives RED metrics generated from the traces pipeline above
      receivers: [otlp, span_metrics]
      processors: [batch]
      exporters: [prometheus]
