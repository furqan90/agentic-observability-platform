# Observability Platform — OpenTelemetry Collector config
#
# The fan-out heart of the platform:
#   • spans  → routing connector → one LangFuse project per `tl.project`
#   • spans  → span_metrics connector → RED metrics → Prometheus (ops)
#   • push metrics (token/cost counters from SDK) → otlp receiver → Prometheus
#
# Multi-project routing (docs/MULTI-PROJECT.md):
#   traces/in ──► resource/project_from_ingress ─► attributes/redaction ─► resource ─► batch
#                   ─┬─► routing/langfuse_projects ─► traces/langfuse-<slug> ─► otlp_http/langfuse-<slug>
#                    └─► span_metrics ─► metrics pipeline
#   The `tl.project` resource attribute picks the project; missing/unknown
#   values go to the default project (otel/projects.yaml: default_project).
#
# Logs (docs/LOGS-PLAN.md §3):
#   logs/in ──► memory_limiter ─► project_from_ingress ─► attributes/redaction ─► transform/log_redaction
#               ─► filter/log_noise ─► resource ─► batch ─► otlp_http/loki (persistent queue on disk)
#
# Metric naming (Collector v0.153.0+):
#   calls_total  →  traces_span_metrics_calls_total
#   duration_milliseconds  →  traces_span_metrics_duration_milliseconds
@@GENERATED_NOTICE@@
extensions:
  # Persistent export queue for logs: a Loki restart or outage holds records here (a named volume, made
  # writable for the Collector's user 10001 by otel-queue-init) and resends them.
  file_storage/queue:
    directory: /var/lib/otelcol/queue
    timeout: 1s

receivers:
  otlp:
    protocols:
      # include_metadata exposes request headers to processors, so the
      # ingress-set X-Langfuse-Project header can pin the project (Phase 4).
      grpc: { endpoint: 0.0.0.0:4317, include_metadata: true }
      http: { endpoint: 0.0.0.0:4318, include_metadata: true }

connectors:
  # "spanmetrics" alias is deprecated in v0.153.0+; use "span_metrics"
  span_metrics:
    histogram:
      explicit:
        buckets: [50ms, 100ms, 250ms, 500ms, 1s, 2s, 5s, 10s, 30s]
    dimensions:
      - name: agent.name
      - name: gen_ai.request.model
      # Resource attribute set by the SDK (LANGFUSE_PROJECT). Prometheus label: tl_project
      - name: tl.project
        default: unset
    metrics_flush_interval: 15s

@@ROUTING_CONNECTOR@@

processors:
  # First in every receiving pipeline: a burst (a crash loop's logs) must not take the Collector down,
  # and with it traces and metrics. Percentages of the container's memory limit.
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 25
  batch: {}
  resource:
    attributes:
      - { key: deployment.platform, value: platform, action: upsert }
  # Ingress-bound project: nginx maps each client bearer token to a project and
  # sets X-Langfuse-Project (nginx/nginx.conf). When present it overrides the
  # agent-supplied tl.project, so a client cannot write into another team's
  # project. Absent header → no-op, agent's tl.project is used.
  resource/project_from_ingress:
    attributes:
      - { key: tl.project, from_context: metadata.x-langfuse-project, action: upsert }
  # Central PII / client-data redaction BEFORE traces reach any backend.
  # Tune the keys to match what your agents attach. (See plan §Security.)
  attributes/redaction:
    actions:
      - { key: user.email, action: delete }
      - { key: user.ip, action: delete }
      - { key: client.ssn, action: delete }
  # Logs only: log text is free-form, so secrets that slipped into a message are rewritten in the body.
  # "$$" is a literal "$" (config expansion), so "$$1" is the regex's first group.
  transform/log_redaction:
    error_mode: ignore
    log_statements:
      - context: log
        statements:
          - 'replace_pattern(body, "sk-[A-Za-z0-9_-]{16,}", "sk-<redacted>")'
          # "Authorization: Bearer <token>" first, scheme included: a pattern that stopped at the scheme
          # redacted the word "Bearer" and left the token (caught by send_test_log.py --checks).
          - 'replace_pattern(body, "(?i)(authorization:\\s*(?:bearer\\s+|basic\\s+)?)[A-Za-z0-9._~+/=-]+", "$$1<redacted>")'
          - 'replace_pattern(body, "(?i)\\b(bearer|basic)\\s+[A-Za-z0-9._~+/=-]+", "$$1 <redacted>")'
          - 'replace_pattern(body, "(?i)(api[_-]?key|token|password|secret)=[^\\s&]+", "$$1=<redacted>")'
          - 'replace_pattern(body, "[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}", "<email>")'
  # Logs only: DEBUG never leaves the machine (D2; records with no severity are kept), nor health checks.
  filter/log_noise:
    error_mode: ignore
    logs:
      log_record:
        - 'severity_number > SEVERITY_NUMBER_UNSPECIFIED and severity_number < SEVERITY_NUMBER_INFO'
        - 'IsMatch(body, "GET /health.* 200")'

exporters:
  # Traces → LangFuse via its native OTLP endpoint, one exporter per project.
  # Each Authorization header is base64("public_key:secret_key") of that project.
  # "otlphttp" alias deprecated in v0.153.0+; use "otlp_http"
@@LANGFUSE_EXPORTERS@@

  # Metrics → Prometheus scrape endpoint on :8889
  prometheus:
    endpoint: 0.0.0.0:8889
    enable_open_metrics: true

  # Logs → Loki's native OTLP endpoint (the exporter appends /v1/logs). Queue on disk, retried for 30 min.
  otlp_http/loki:
    endpoint: http://loki:3100/otlp
    sending_queue:
      enabled: true
      storage: file_storage/queue
      queue_size: 5000
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 30m

service:
  extensions: [file_storage/queue]
  telemetry:
    # The Collector's own metrics (queue size, failed and refused records) for Prometheus on :8888.
    # The default listens on localhost only, which Prometheus can't reach.
    metrics:
      level: normal
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    traces/in:
      receivers: [otlp]
      # project_from_ingress must run before batch: batch drops request metadata.
      processors: [memory_limiter, resource/project_from_ingress, attributes/redaction, resource, batch]
      exporters: [routing/langfuse_projects, span_metrics]
@@PROJECT_PIPELINES@@
    metrics:
      # otlp: accepts push metrics from SDK (token/cost counters via OTLP /v1/metrics)
      # span_metrics: receives RED metrics generated from the traces pipeline above
      receivers: [otlp, span_metrics]
      processors: [memory_limiter, batch]
      exporters: [prometheus]
    logs/in:
      receivers: [otlp]
      # project_from_ingress before batch, as in traces/in: batch drops request metadata.
      processors: [memory_limiter, resource/project_from_ingress, attributes/redaction, transform/log_redaction,
                   filter/log_noise, resource, batch]
      exporters: [otlp_http/loki]
