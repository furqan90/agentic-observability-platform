#  Observability Platform — Stage 1 (local dev, full LangFuse v3 stack)
# Start with:  scripts/setup.ps1   (or)   docker compose -f docker-compose/docker-compose.yml --env-file .env up -d
#
# Internal service ports (Postgres/ClickHouse/Redis/MinIO) are NOT published here.
# Use docker-compose.override.yml to expose them for local poking.

services:
  postgres:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  clickhouse:
    image: clickhouse/clickhouse-server:24
    restart: unless-stopped
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      # Single-node cluster config: enables built-in Keeper + defines the "default"
      # cluster that LangFuse v3 migration targets with ReplicatedMergeTree.
      - ../clickhouse/single-node-cluster.xml:/etc/clickhouse-server/config.d/single-node-cluster.xml:ro
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--maxmemory-policy", "noeviction"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # One-shot: create the langfuse bucket, then exit.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID} ${LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY} &&
      mc mb -p local/${LANGFUSE_S3_EVENT_UPLOAD_BUCKET} &&
      echo 'bucket ready'"

  langfuse-worker:
    image: langfuse/langfuse-worker:3
    restart: unless-stopped
    depends_on:
      postgres:    { condition: service_healthy }
      clickhouse:  { condition: service_healthy }
      redis:       { condition: service_healthy }
      minio:       { condition: service_healthy }
    env_file: [../.env]
    environment:
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}

  langfuse-web:
    image: langfuse/langfuse:3
    restart: unless-stopped
    depends_on:
      postgres:    { condition: service_healthy }
      clickhouse:  { condition: service_healthy }
      redis:       { condition: service_healthy }
      minio:       { condition: service_healthy }
    ports:
      - "3000:3000"
    env_file: [../.env]
    environment:
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    restart: unless-stopped
    depends_on:
      - langfuse-web
    volumes:
      - ../otel/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml
    environment:
      # Consumed by ${env:LANGFUSE_OTEL_AUTH} in the collector config.
      LANGFUSE_OTEL_AUTH: ${LANGFUSE_OTEL_AUTH}
    ports:
      - "4317:4317"   # OTLP gRPC (agents send here)
      - "4318:4318"   # OTLP HTTP
      - "8889:8889"   # Prometheus exporter (scraped by Prometheus)

  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    volumes:
      - ../prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    depends_on:
      - prometheus
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ../grafana/provisioning:/etc/grafana/provisioning
      - ../grafana/dashboards:/var/lib/grafana/dashboards
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: "http://localhost:3001"
      GF_SERVER_SERVE_FROM_SUB_PATH: "false"

  # ── Infra exporters: the agent↔infra correlation side (see plan §Division of labor) ──
  #
  # node-exporter requires Linux host bind-mounts (pid:host, /:/host:ro,rslave)
  # that Docker Desktop for Windows cannot expose. Gated behind "linux" profile.
  # On Linux / CI / AKS node:  docker compose ... --profile linux up -d
  # On AKS in production:       DaemonSet (see Stage 2 k8s/ manifests)
  node-exporter:
    profiles: ["linux"]
    image: prom/node-exporter:latest
    restart: unless-stopped
    command:
      - "--path.rootfs=/host"
    pid: host
    volumes:
      - /:/host:ro,rslave

  # cadvisor: full Linux host mount variant (linux profile only, same reason as above).
  # Windows users: use the "cadvisor-windows" service below instead — it uses only
  # the Docker socket and works on Docker Desktop without privileged host mounts.
  cadvisor:
    profiles: ["linux"]
    image: gcr.io/cadvisor/cadvisor:latest
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro

  # cadvisor-windows: Docker-socket-only variant that works on Docker Desktop (WSL2).
  # Gives per-container CPU/memory metrics. No host-level CPU/mem (use Task Manager
  # for that on Windows). Activated by default (no profile gate).
  cadvisor-windows:
    image: gcr.io/cadvisor/cadvisor:latest
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command:
      - "--docker_only=true"
      - "--store_container_labels=false"

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable"

volumes:
  postgres_data:
  clickhouse_data:
  minio_data:
  prometheus_data:
  grafana_data:
