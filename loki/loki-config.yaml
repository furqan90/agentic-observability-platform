# Loki 3.7, single binary (docs/LOGS-PLAN.md §4, phase L0).
# Logs arrive as OTLP at /otlp/v1/logs: from the Collector's logs pipeline (L1), or straight from
# scripts/send_test_log.py (the deploy smoke). Grafana reads it as the data source uid "loki".
#
# Labels (indexed): only the four resource attributes below. Every other resource or record attribute
# (trace_id, span_id, logger.name, code.*, extra={...} fields) is structured metadata: queryable, not indexed.
# Never index trace, thread, page or user ids: unbounded values blow up the index.

auth_enabled: false            # one tenant; tl_project is a label (D4)

server:
  http_listen_port: 3100
  grpc_listen_port: 9095
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules

schema_config:
  configs:
    - from: 2026-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

limits_config:
  retention_period: 720h        # 30 days, as Prometheus (D5)
  allow_structured_metadata: true
  volume_enabled: true
  ingestion_rate_mb: 8
  ingestion_burst_size_mb: 16
  max_line_size: 256KB
  max_line_size_truncate: true  # a longer line is cut, not rejected
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  otlp_config:
    resource_attributes:
      ignore_defaults: true     # Loki's default list includes per-instance ids; index only these four
      attributes_config:
        - action: index_label
          attributes:
            - service.name            # → service_name
            - deployment.environment  # → deployment_environment
            - tl.project              # → tl_project
            - host.name               # → host_name

query_range:
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 64         # inside the VM's 512 MB cap

analytics:
  reporting_enabled: false
